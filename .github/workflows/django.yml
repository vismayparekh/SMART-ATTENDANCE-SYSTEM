name: Django CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Pick versions supported by your Django version.
        # Django 4.2 LTS: 3.8–3.12; Django 5.x: 3.10+
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations (optional)
        run: |
          python manage.py migrate --noinput
        # If your tests use a separate test DB/migrations, keep this.
        # Otherwise you can remove this step.

      - name: Run tests
        run: |
          python manage.py test
