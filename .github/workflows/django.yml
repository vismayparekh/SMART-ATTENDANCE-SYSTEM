name: Django CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  sanity:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install django
          fi

      - name: Quick project health check
        run: |
          python - <<'PY'
          import os, sys
          import django
          print("Python OK")
          print("Django", django.get_version())
          assert os.path.isfile("manage.py"), "manage.py not found at repo root"
          PY

      - name: Django system check
        # This validates settings/apps load. If your settings need env vars,
        # set them here via `env:` to avoid failures.
        run: python manage.py check

      - name: Run unit tests (only if they exist)
        run: |
          if ls **/tests.py **/tests/*.py 2>/dev/null; then
            echo "Tests found. Running..."
            python manage.py test --verbosity 2
          else
            echo "No tests found; skipping."
          fi
