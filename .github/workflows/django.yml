name: Django CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      # 👇 set this to your real settings module (e.g. "config.settings" or "mysite.settings")
      DJANGO_SETTINGS_MODULE: mysite.settings
      # provide a dummy secret key so Django can start
      SECRET_KEY: "ci-secret-key"
      # force sqlite so we don't need a DB service
      DATABASE_URL: "sqlite:///./ci.sqlite3"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          # If requirements.txt is missing or incomplete, at least get Django running:
          python - <<'PY'
          import sys, subprocess
          reqs = ["django", "dj-database-url"]
          subprocess.check_call([sys.executable, "-m", "pip", "install", *reqs])
          PY

      - name: Show environment info
        run: |
          python -V
          python -c "import django; print('Django', django.get_version())"
          ls -la
          echo "manage.py present?"; test -f manage.py && echo yes || (echo no && exit 1)

      - name: Check Django
        run: |
          python manage.py check --deploy --fail-level WARNING || true
          python manage.py showmigrations --plan || true

      - name: Run migrations
        run: |
          python manage.py migrate --noinput --verbosity 2

      - name: Run tests
        # If you use pytest-django, change to: pytest -q
        run: |
          python manage.py test --verbosity 2
